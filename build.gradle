plugins {
    id("java")
    id("jacoco")
    id("org.springframework.boot") version "3.2.0" apply false
    id("io.spring.dependency-management") version "1.1.4" apply false
    id("fabric-loom") version "1.9-SNAPSHOT" apply false
}


java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

allprojects {
    group = project.findProperty("maven_group") ?: "com.foxsoftware"
    version = project.findProperty("mod_version") ?: "1.0-SNAPSHOT"
    repositories {
        maven { name = "CentralDirect"; url = uri("https://repo1.maven.org/maven2/") }

        mavenCentral()
        maven { url = uri("https://maven.fabricmc.net/") }


    }
}

subprojects {
    apply plugin: "java"

    tasks.withType(JavaCompile).configureEach {
        options.release.set(17)
        options.encoding = "UTF-8"
    }

    dependencies {
        compileOnly "org.projectlombok:lombok:${lombok_version}"
        annotationProcessor "org.projectlombok:lombok:${lombok_version}"
        testCompileOnly "org.projectlombok:lombok:${lombok_version}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"

        testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
        testImplementation "org.mockito:mockito-core:${mockito_version}"
    }

    test { useJUnitPlatform() }
}

// Domain
project(":game-domain") {}

// Application
project(":game-application") {
    dependencies {
        implementation project(":game-domain")
    }
}

// Infra
project(":game-infra") {
    dependencies {
        implementation project(":game-domain")
        implementation project(":game-application")
        implementation "org.xerial:sqlite-jdbc:${sqlite_driver_version}"
        implementation "org.flywaydb:flyway-core:${flyway_version}"
        implementation "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
        implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jackson_version}"
    }
}

// Admin API
project(":game-admin-api") {
    apply plugin: "org.springframework.boot"
    apply plugin: "io.spring.dependency-management"
    project(":game-admin-api") {
        repositories {
            maven { url = uri("https://repo1.maven.org/maven2/") }
            mavenCentral()
        }
    }

    dependencies {
        implementation project(":game-domain")
        implementation project(":game-application")
        implementation project(":game-infra")

        implementation "org.springframework.boot:spring-boot-starter-web:${spring_boot_version}"
        implementation "org.springframework.boot:spring-boot-starter-websocket:${spring_boot_version}"
        implementation "org.springframework.boot:spring-boot-starter-actuator:${spring_boot_version}"
        implementation "io.micrometer:micrometer-registry-prometheus"

        implementation group: 'com.bucket4j', name: 'bucket4j_jdk11-core', version: '8.15.0'

        implementation "io.jsonwebtoken:jjwt-api:${jjwt_version}"
        runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwt_version}"
        runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwt_version}"

        implementation "org.flywaydb:flyway-core:${flyway_version}"
        implementation "org.xerial:sqlite-jdbc:${sqlite_driver_version}"
        implementation "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
        implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jackson_version}"
    }
}

// Fabric Mod
project(":game-mod-fabric") {
    apply plugin: "fabric-loom"

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

        implementation project(":game-domain")
        implementation project(":game-application")
    }

    loom {
        runs {
            server {
                server()
                name "SFE Dev Server"
            }
        }
    }
}

// Plugins (占位)
project(":game-plugins:loot-weighted") {
    dependencies { implementation project(":game-domain") }
}
project(":game-plugins:extraction-basic") {
    dependencies {
        implementation project(":game-domain")
        implementation project(":game-application")
    }
}